<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFTORY — VOLT Direction</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0A;
    color: #E8E8E8;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero { text-align: center; padding: 60px 40px 48px; border-bottom: 1px solid #1A1A1A; }
  .hero-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #71717A; margin-bottom: 20px; }
  .hero h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -0.03em; margin-bottom: 10px; }
  .hero h1 span { color: #E63946; }
  .hero p { font-size: 15px; color: #71717A; font-weight: 300; }

  .swatches { padding: 48px 40px; border-bottom: 1px solid #1A1A1A; }
  .swatches h3 { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #71717A; margin-bottom: 32px; text-align: center; }
  .sw-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sw-box { width: 64px; height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.06); }
  .sw-lbl { font-size: 9px; color: #71717A; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .sw-hex { font-size: 10px; color: #71717A; font-family: monospace; }

  .sec-hdr { padding: 56px 20px 16px; text-align: center; border-top: 1px solid #1A1A1A; }
  .sec-hdr h2 { font-family: 'Syne'; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin-bottom: 6px; }
  .sec-hdr p { font-size: 13px; color: #71717A; margin-bottom: 36px; }
  .sec-hdr .tag { display: inline-block; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; padding: 4px 12px; border-radius: 6px; margin-bottom: 12px; font-weight: 700; }
  .sec-hdr .tag.dk { background: rgba(230,57,70,0.10); color: #E63946; }
  .sec-hdr .tag.lt { background: rgba(192,49,60,0.08); color: #C0313C; }

  .grid1 { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; padding: 0 20px 60px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .col-label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

  .phone { width: 300px; border-radius: 34px; border: 2px solid #1E1E1E; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .phone::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 110px; height: 26px; border-radius: 0 0 14px 14px; z-index: 10; }
  .pc { width: 100%; overflow-y: auto; padding: 42px 18px 22px; scrollbar-width: none; }
  .pc::-webkit-scrollbar { display: none; }

  .vdk { background: #0D0D0F; }
  .vdk::before { background: #111; }
  .vlt { background: #FAFAFA; border-color: #E4E4E7; }
  .vlt::before { background: #F4F4F5; }

  .footer { text-align: center; padding: 40px; border-top: 1px solid #1A1A1A; font-size: 12px; color: #71717A; margin-top: 20px; }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-label">Volt Direction / April 2026</div>
  <h1>LIFTORY — <span>VOLT</span></h1>
  <p>Misma app, misma tipografia, paleta Volt aplicada</p>
</section>

<section class="swatches">
  <h3>Volt Palette</h3>
  <div class="sw-row">
    <div class="sw"><div class="sw-box" style="background:#0D0D0F;"></div><div class="sw-lbl">Pitch</div><div class="sw-hex">#0D0D0F</div></div>
    <div class="sw"><div class="sw-box" style="background:#1A1A1D;"></div><div class="sw-lbl">Graphite</div><div class="sw-hex">#1A1A1D</div></div>
    <div class="sw"><div class="sw-box" style="background:#E63946;"></div><div class="sw-lbl">Ignite</div><div class="sw-hex">#E63946</div></div>
    <div class="sw"><div class="sw-box" style="background:#FAFAFA;"></div><div class="sw-lbl">Clean</div><div class="sw-hex">#FAFAFA</div></div>
    <div class="sw"><div class="sw-box" style="background:#71717A;"></div><div class="sw-lbl">Zinc</div><div class="sw-hex">#71717A</div></div>

  </div>

        accentBg:'rgba(192,49,60,0.08)', accentBg2:'rgba(192,49,60,0.14)' }
};

          </div>

            <svg width="44" height="44" viewBox="0 0 44 44" style="transform:rotate(-90deg);">

        <div style="font-size:11px;color:${t.muted};">1 ejercicio / Core y cardio</div>
        <div style="font-size:10px;color:${t.muted};margin-top:6px;font-weight:600;">Pendiente</div>
      </div>
      <button style="background:${t.accent};color:#FFF;border:none;border-radius:12px;padding:14px 0;font-size:14px;font-weight:700;letter-spacing:0.04em;width:100%;font-family:'Inter';margin-top:8px;">TERMINAR SESION</button>`;

    const inpBg = isDk ? t.accentBg : '#F4F4F5';
    inner = `

      <div style="font-family:'Syne';font-weight:800;font-size:18px;color:${t.text};letter-spacing:-0.02em;margin-bottom:4px;">HEAVY BLOCK — A</div>
