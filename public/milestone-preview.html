<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milestone Celebration Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#FAF9F6; font-family:'DM Sans',sans-serif; display:flex; flex-direction:column; align-items:center; padding:40px 20px; gap:40px; }
h2 { font-family:'Syne',sans-serif; font-weight:800; font-size:18px; letter-spacing:-0.03em; color:#1a1a1a; }
.preview-row { display:flex; gap:50px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
.preview-box { display:flex; flex-direction:column; align-items:center; gap:16px; }
.label { font-size:12px; color:#999; }

.icon-wrap {
  width:130px; height:130px; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.icon-glow {
  position:absolute; inset:-12px; border-radius:50%;
  opacity:0; transition:opacity 0.6s ease 0.4s; filter:blur(12px);
}
.icon-emoji {
  font-size:80px; line-height:1;
  transform:scale(0.5);
  transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.icon-wrap.animated .icon-emoji { transform:scale(1); }
.icon-wrap.animated .icon-glow { opacity:0.5; }

/* Overlay */
.overlay {
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,0); backdrop-filter:blur(0px);
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
  transition: background 0.4s ease, backdrop-filter 0.4s ease;
}
.overlay.active {
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
  pointer-events:auto;
}
.modal {
  display:flex; flex-direction:column; align-items:center;
  padding:40px 32px 32px; max-width:320px; width:85%;
  border-radius:24px; background:#FAF9F6;
  box-shadow:0 25px 60px rgba(0,0,0,0.3);
  transform:scale(0.7) translateY(30px); opacity:0;
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.overlay.active .modal { transform:scale(1) translateY(0); opacity:1; }

.modal-title {
  font-family:'Syne',sans-serif; font-weight:800; font-size:24px;
  letter-spacing:-0.03em; color:#1a1a1a; text-align:center; line-height:1.15;
  margin-top:8px; opacity:0; transform:translateY(16px);
  transition:all 0.5s ease 0.6s;
}
.overlay.active .modal-title { opacity:1; transform:translateY(0); }

.modal-sub {
  font-size:14px; color:#888; text-align:center; max-width:240px;
  line-height:1.5; margin-top:6px; opacity:0; transform:translateY(12px);
  transition:all 0.5s ease 0.8s;
}
.overlay.active .modal-sub { opacity:1; transform:translateY(0); }

.accent-line {
  width:0; height:3px; border-radius:2px; margin-top:10px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.15, 1) 1s;
}
.overlay.active .accent-line { width:40px; }

.dismiss-btn {
  margin-top:18px; padding:12px 32px; border-radius:100px; border:none;
  background:#1a1a1a; color:#fff; font-family:'Syne',sans-serif; font-weight:700;
  font-size:12px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
  opacity:0; transform:translateY(10px); transition:all 0.4s ease 1.1s;
}
.overlay.active .dismiss-btn { opacity:1; transform:translateY(0); }

button.trigger {
  padding:14px 28px; border-radius:100px; border:none;
  background:#1a1a1a; color:#fff; font-family:'Syne',sans-serif; font-weight:700;
  font-size:13px; letter-spacing:0.04em; cursor:pointer;
}

/* Vein SVG overlay */
.vein-overlay {
  position:absolute; top:0; left:0; pointer-events:none;
}
.vein-overlay path {
  transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.15, 1) 0.5s;
}
.vein-overlay .branch {
  transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.15, 1) 1s;
}

/* Sparkle SVG overlay */
.sparkle-overlay {
  position:absolute; top:0; left:0; pointer-events:none;
}
</style>
</head>
<body>

<h2>LIFTORY Milestone Preview</h2>

<div class="preview-row">
  <!-- BICEP -->
  <div class="preview-box">
    <div class="label">MALE</div>
    <div class="icon-wrap" id="bicep-wrap">
      <div class="icon-glow" style="background:radial-gradient(circle, rgba(122,139,92,0.35) 0%, transparent 70%)"></div>
      <div class="icon-emoji" id="bicep-emoji">💪</div>
      <svg class="vein-overlay" width="130" height="130" viewBox="0 0 120 120">
        <path d="M52 38 Q55 48, 50 58 Q48 64, 52 70" fill="none" stroke="#7A8B5C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="50" stroke-dashoffset="50" id="vein1"/>
        <path class="branch" d="M51 52 Q56 50, 58 46" fill="none" stroke="#7A8B5C" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="18" stroke-dashoffset="18" id="vein2"/>
      </svg>
    </div>
    <button class="trigger" onclick="animateBicep()">Animar</button>
  </div>

  <!-- PEACH -->
  <div class="preview-box">
    <div class="label">FEMALE</div>
    <div class="icon-wrap" id="peach-wrap">
      <div class="icon-glow" style="background:radial-gradient(circle, rgba(201,169,110,0.4) 0%, transparent 70%)"></div>
      <div class="icon-emoji" id="peach-emoji">🍑</div>
      <svg class="sparkle-overlay" width="130" height="130" viewBox="0 0 120 120">
        <path d="M38 42 Q42 35, 46 40" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="20" stroke-dashoffset="20" opacity="0" id="shine"/>
        <circle cx="34" cy="36" r="2" fill="white" opacity="0" id="sp1"/>
        <circle cx="86" cy="44" r="1.5" fill="#C9A96E" opacity="0" id="sp2"/>
        <circle cx="42" cy="30" r="1.5" fill="#C9A96E" opacity="0" id="sp3"/>
        <circle cx="78" cy="32" r="1" fill="white" opacity="0" id="sp4"/>
        <g id="star-sparkle" opacity="0" transform="translate(82, 28)">
          <line x1="0" y1="-4" x2="0" y2="4" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="-4" y1="0" x2="4" y2="0" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" stroke="#C9A96E" stroke-width="1" stroke-linecap="round"/>
          <line x1="2.8" y1="-2.8" x2="-2.8" y2="2.8" stroke="#C9A96E" stroke-width="1" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <button class="trigger" onclick="animatePeach()">Animar</button>
  </div>
</div>

<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
  <button class="trigger" onclick="showMilestone('male')">Milestone (Male)</button>
  <button class="trigger" onclick="showMilestone('female')" style="background:#C75B39">Milestone (Female)</button>
</div>

<!-- Milestone overlay -->
<div class="overlay" id="milestone-overlay" onclick="hideMilestone()">
  <div class="modal" onclick="event.stopPropagation()">
    <div id="modal-icon" style="font-size:70px;line-height:1;margin-bottom:4px"></div>
    <div class="modal-title" id="modal-title">Primer entrenamiento completo</div>
    <div class="modal-sub">La consistencia empieza con uno. Bienvenido.</div>
    <div class="accent-line" id="accent-line" style="background:#7A8B5C"></div>
    <button class="dismiss-btn" onclick="hideMilestone()">SEGUIR</button>
  </div>
</div>

<script>
function resetBicep() {
  document.getElementById('bicep-wrap').classList.remove('animated');
  document.getElementById('bicep-emoji').style.transform = 'scale(0.5)';
  document.getElementById('vein1').setAttribute('stroke-dashoffset', '50');
  document.getElementById('vein2').setAttribute('stroke-dashoffset', '18');
}

function animateBicep() {
  resetBicep();
  setTimeout(() => {
    document.getElementById('bicep-emoji').style.transform = 'scale(0.8)';
  }, 300);
  setTimeout(() => {
    document.getElementById('bicep-wrap').classList.add('animated');
    document.getElementById('bicep-emoji').style.transform = 'scale(1)';
    document.getElementById('vein1').setAttribute('stroke-dashoffset', '0');
    document.getElementById('vein2').setAttribute('stroke-dashoffset', '0');
  }, 900);
}

function resetPeach() {
  document.getElementById('peach-wrap').classList.remove('animated');
  document.getElementById('peach-emoji').style.transform = 'scale(0.5)';
  document.getElementById('shine').setAttribute('stroke-dashoffset', '20');
  document.getElementById('shine').setAttribute('opacity', '0');
  ['sp1','sp2','sp3','sp4','star-sparkle'].forEach(id => document.getElementById(id).setAttribute('opacity', '0'));
}

function animatePeach() {
  resetPeach();
  setTimeout(() => {
    document.getElementById('peach-emoji').style.transform = 'scale(0.8)';
  }, 300);
  setTimeout(() => {
    document.getElementById('peach-wrap').classList.add('animated');
    document.getElementById('peach-emoji').style.transform = 'scale(1)';
    document.getElementById('shine').setAttribute('stroke-dashoffset', '0');
    document.getElementById('shine').setAttribute('opacity', '0.9');
    setTimeout(() => { document.getElementById('sp1').setAttribute('opacity', '0.8'); }, 300);
    setTimeout(() => { document.getElementById('sp2').setAttribute('opacity', '0.9'); }, 400);
    setTimeout(() => { document.getElementById('sp3').setAttribute('opacity', '0.7'); }, 500);
    setTimeout(() => { document.getElementById('sp4').setAttribute('opacity', '0.6'); }, 600);
    setTimeout(() => { document.getElementById('star-sparkle').setAttribute('opacity', '1'); }, 200);
  }, 900);
}

function showMilestone(gender) {
  const overlay = document.getElementById('milestone-overlay');
  const icon = document.getElementById('modal-icon');
  const line = document.getElementById('accent-line');

  if (gender === 'female') {
    icon.textContent = '🍑';
    line.style.background = '#C9A96E';
  } else {
    icon.textContent = '💪';
    line.style.background = '#7A8B5C';
  }

  overlay.classList.add('active');
}

function hideMilestone() {
  document.getElementById('milestone-overlay').classList.remove('active');
}

// Auto-animate on load
setTimeout(animateBicep, 600);
setTimeout(animatePeach, 600);
</script>
</body>
</html>
